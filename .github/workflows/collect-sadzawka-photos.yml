name: Collect Sadzawka photos

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of missing-photo cards to process (0 = all)'
        required: false
        default: '3'
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

concurrency:
  group: sadzawka-photo-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate one plant at a time
        run: python scripts/collect_sadzawka_photos.py --limit \${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
      - name: Commit verified URLs and run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/exports/pilot-sadzawka.json catalog/exports/photo-collection-log.json
          if ! git diff --cached --quiet; then
            git commit -m "Collect verified Sadzawka remote photo URLs"
            git push
          fi
