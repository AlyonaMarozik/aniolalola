name: Collect Sadzawka botanical catalog for review

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum product detail pages to collect into local JSON (1-200)'
        required: true
        default: '50'

permissions:
  contents: read

concurrency:
  group: stage-sadzawka-catalog
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/collect_sadzawka_catalog.py
      - name: Check botanical extraction regressions
        run: python -m unittest discover -s tests -p 'test_sadzawka_extraction.py'
      - name: Collect into local JSON only
        run: python scripts/collect_sadzawka_catalog.py --limit "${{ inputs.limit }}"
      - name: Upload review JSON without committing to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadzawka-botanical-review
          path: |
            catalog/exports/sadzawka-catalog-review.json
            catalog/exports/sadzawka-catalog-queue.json
          if-no-files-found: warn
          retention-days: 30
