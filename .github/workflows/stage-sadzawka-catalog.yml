name: Stage Sadzawka botanical catalog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Product detail pages to inspect (1–200)'
        required: true
        default: '50'

permissions:
  contents: write

concurrency:
  group: stage-sadzawka-catalog
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject master data writes
        run: test "${{ github.ref_name }}" != "master"
      - name: Check Python syntax
        run: python -m py_compile scripts/collect_sadzawka_catalog.py
      - name: Stage botanical catalog for review
        run: python scripts/collect_sadzawka_catalog.py --limit "${{ inputs.limit }}"
      - name: Commit staging files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/exports/sadzawka-catalog-review.json catalog/exports/sadzawka-catalog-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage Sadzawka botanical candidates for review"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
